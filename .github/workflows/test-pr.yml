name: Test PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: mise run test

      - name: Upload test coverage to Codacy
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -l TypeScript -r coverage/lcov.info
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        continue-on-error: true

      - name: Upload test coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info
        continue-on-error: true

  # baloo's Git hook Checks, for commits made where its hooks didn't run (its README's CI section)
  git-hook-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run baloo's checks on the PR's commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.base_ref }}
        run: |
          set -e
          version=0.25.1
          file=baloo_${version}_linux_amd64
          dir=$(mktemp -d)
          for f in "$file" SHA256SUMS; do
            curl -fsSL -o "$dir/$f" "https://github.com/bunderlog/claude-plugins/releases/download/v$version/$f"
          done
          (cd "$dir" && grep " $file\$" SHA256SUMS | sha256sum -c -)
          baloo=$dir/$file
          chmod +x "$baloo"
          BASE=$(git merge-base "$PR_BASE" HEAD)
          for sha in $(git rev-list "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" > "$dir/msg"
            "$baloo" check conventional-commits "$dir/msg"
            "$baloo" check no-ai-coauthor "$dir/msg"
          done
          echo "refs/heads/ci $(git rev-parse HEAD) refs/heads/$BRANCH $BASE" | "$baloo" check linear-history
          git reset -q --soft "$BASE"
          "$baloo" check no-secrets-in-commits
          "$baloo" check no-conflict-markers
          "$baloo" check no-large-files
