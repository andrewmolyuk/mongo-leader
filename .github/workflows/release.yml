name: Release

on:
  push:
    branches: [master]

jobs:
  # baloo's Git hook Checks, for commits pushed to master where its hooks didn't run
  git-hook-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run baloo's checks on the pushed commits
        env:
          BASE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: sh .github/scripts/baloo-checks.sh

  release:
    needs: git-hook-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: mise run test

      - name: Upload test coverage to Codacy
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -l TypeScript -r coverage/lcov.info
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        continue-on-error: true

      - name: Upload test coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info
        continue-on-error: true

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
