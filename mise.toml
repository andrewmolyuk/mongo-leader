[tools]
node = "24"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.lint]
description = "Lint and format JS, Markdown and JSON"
run = [
  "npx eslint . --fix",
  "npx markdownlint --fix '**/*.md' -i node_modules",
  "npx prettier --write '**/*.md' '**/*.json' '**/*.js' '**/*.cjs'",
]

[tasks.test]
description = "Lint, then run the Jest suite with coverage"
depends = ["lint"]
run = "npx jest --detectOpenHandles --forceExit"

[tasks.update]
description = "Bump dependencies to their latest versions"
run = ["npx npm-check-updates -u", "npm install --no-fund --no-audit"]
