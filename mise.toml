[tools]
node = "24"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.lint]
description = "Lint and format TypeScript, Markdown and JSON"
run = [
  "npx oxlint --fix --deny-warnings",
  "npx markdownlint --fix '**/*.md' -i node_modules",
  "npx prettier --write '**/*.md' '**/*.json' '**/*.ts' '**/*.mts'",
]

[tasks.build]
description = "Compile src/ to dist/ with type definitions"
run = "npx tsc -p tsconfig.build.json"

[tasks.typecheck]
description = "Typecheck the source and tests, then check the built dist/index.d.ts against the type tests"
depends = ["build"]
run = ["npx tsc", "npx tsc -p tests/types"]

[tasks.test]
description = "Lint and typecheck, then run the Vitest suite with coverage"
depends = ["lint", "typecheck"]
run = "npx vitest run"

[tasks.update]
description = "Bump dependencies to their latest versions"
run = ["npx npm-check-updates -u", "npm install --no-fund --no-audit"]
